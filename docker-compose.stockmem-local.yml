services:
  stockmem_db:
    image: pgvector/pgvector:pg16
    container_name: marketlens-stockmem-db
    environment:
      POSTGRES_DB: stockmem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"
    volumes:
      - stockmem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockmem"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stockmem_pgdata:
