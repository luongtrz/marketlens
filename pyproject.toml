[project]
name = "crypto-pipeline"
version = "0.1.0"
description = "Crypto News Intelligence Pipeline — monitors crypto news, scores with AI, correlates with market data, and produces trading signals"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
crawler = [
    "feedparser>=6.0.10",
    "redis>=5.0.0",
]
aihub = [

    "openai>=1.10.0",
    "groq>=0.28.0",
    "google-generativeai>=0.8.0",
]
market = [
    "python-binance>=1.0.0",
]
stockmem = [
    "faiss-cpu>=1.8.0",
    "pgvector>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "crawler*", "aihub*", "market_data*", "stockmem*", "factor_ledge*", "main_controller*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "crawler/tests",
    "aihub/tests",
    "market_data/tests",
    "stockmem/tests",
    "factor_ledge/tests",
    "main_controller/tests",
    "shared/tests",
]
markers = [
    "integration: mark test as integration test",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
