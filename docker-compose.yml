version: '3.8'

services:
  db:
    image: postgres:15
    container_name: marketlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketlens
    ports:
      - "5433:5432"
    volumes:
      - marketlens_data:/var/lib/postgresql/data

volumes:
  marketlens_data:
