services:
  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    command: uvicorn crawler.src.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      AIHUB_URL: http://aihub:8001
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/ingestion
      REDIS_URL: redis://redis:6379
      CRAWLER_SUPABASE_URL: ${SUPABASE_URL:-}
      CRAWLER_SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CRAWLER_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      aihub:
        condition: service_started

  aihub:
    build:
      context: .
      dockerfile: aihub/Dockerfile
    ports: ["8001:8001"]
    environment:
      AIHUB_STOCKMEM_URL: http://stockmem:8003
      AIHUB_LLM_BACKEND: ${AIHUB_LLM_BACKEND:-groq}
      AIHUB_PREDICT_LLM_BACKEND: gemini
      AIHUB_GEMINI_MODEL: gemini-3.1-flash-lite
      AIHUB_GROQ_API_KEY: [REDACTED_GROQ_TOKEN]
      AIHUB_GROQ_MODEL: ${AIHUB_GROQ_MODEL:-llama-3.3-70b-versatile}
      AIHUB_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AIHUB_GEMINI_API_KEY: [REDACTED_GOOGLE_API_KEY]
      AIHUB_POST_RULE_ENABLED: ${AIHUB_POST_RULE_ENABLED:-true}
      AIHUB_POST_RULE_BULL_30D_PCT: ${AIHUB_POST_RULE_BULL_30D_PCT:-10}
      AIHUB_POST_RULE_BEAR_30D_PCT: ${AIHUB_POST_RULE_BEAR_30D_PCT:--10}
      AIHUB_POST_RULE_UP_3D_PCT: ${AIHUB_POST_RULE_UP_3D_PCT:-3}
      AIHUB_POST_RULE_DOWN_3D_PCT: ${AIHUB_POST_RULE_DOWN_3D_PCT:--3}
      AIHUB_POST_RULE_MACD_CONFIRM_EPS: ${AIHUB_POST_RULE_MACD_CONFIRM_EPS:-0}
      AIHUB_POST_RULE_HOLD_OVERRIDE_MAX_CONF: ${AIHUB_POST_RULE_HOLD_OVERRIDE_MAX_CONF:-0.72}

  market_data:
    build:
      context: .
      dockerfile: market_data/Dockerfile
    ports: ["8002:8002"]
    environment:
      MARKET_SOURCE: binance
      MARKET_TRACKED_SYMBOLS: '["BTC", "ETH"]'  # Add/remove coins here
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/market
    depends_on:
      db:
        condition: service_healthy

  stockmem:
    build:
      context: .
      dockerfile: stockmem/Dockerfile
    ports: ["8003:8003"]
    environment:
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/postgres
      VECTOR_BACKEND: memory
    depends_on:
      db:
        condition: service_healthy

  factor_ledge:
    build:
      context: .
      dockerfile: factor_ledge/Dockerfile
    ports: ["8004:8004"]
    environment:
      STOCKMEM_URL: http://stockmem:8003
      GROQ_API_KEY: ${AIHUB_GROQ_API_KEY:-}
    depends_on:
      - stockmem

  main_controller:
    build:
      context: .
      dockerfile: main_controller/Dockerfile
    ports: ["8005:8005"]
    environment:
      MAIN_CONTROLLER_CRAWLER_URL: http://crawler:8000
      MAIN_CONTROLLER_AIHUB_URL: http://aihub:8001
      MAIN_CONTROLLER_MARKET_DATA_URL: http://market_data:8002
      MAIN_CONTROLLER_STOCKMEM_URL: http://stockmem:8003
      MAIN_CONTROLLER_FACTORLEDGE_URL: http://factor_ledge:8004
      MAIN_CONTROLLER_DB_URL: postgresql+asyncpg://postgres:pass@db:5432/postgres
      MAIN_CONTROLLER_JWT_SECRET: ${MAIN_CONTROLLER_JWT_SECRET:-change-me}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_TABLE: ${SUPABASE_TABLE:-news_articles}
    depends_on:
      - crawler
      - aihub
      - market_data
      - stockmem
      - factor_ledge

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      - main_controller

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
