services:
  crawler:
    build: ./crawler
    ports: ["8000:8000"]
    environment:
      AIHUB_URL: http://aihub:8001
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/ingestion
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      aihub:
        condition: service_started

  aihub:
    build: ./aihub
    ports: ["8001:8001"]
    environment:
      GPT_API_KEY: ${GPT_API_KEY}
      GPT_MODEL: gpt-oss-120b

  market_data:
    build: ./market_data
    ports: ["8002:8002"]
    environment:
      MARKET_SOURCE: binance
      MARKET_BINANCE_API_KEY: ${BINANCE_API_KEY}
      MARKET_BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      MARKET_TRACKED_SYMBOLS: BTC,ETH,SOL,BNB,XRP  # Add/remove coins here
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/market
    depends_on:
      db:
        condition: service_healthy

  stockmem:
    build:
      context: .
      dockerfile: stockmem/Dockerfile
    ports: ["8003:8003"]
    environment:
      DB_URL: postgresql+asyncpg://postgres:pass@db:5432/stockmem
      VECTOR_BACKEND: memory
    depends_on:
      db:
        condition: service_healthy

  factor_ledge:
    build: ./factor_ledge
    ports: ["8004:8004"]
    environment:
      STOCKMEM_URL: http://stockmem:8003
    depends_on:
      - stockmem

  main_controller:
    build: ./main_controller
    ports: ["8005:8005"]
    environment:
      CRAWLER_URL: http://crawler:8000
      AIHUB_URL: http://aihub:8001
      MARKET_DATA_URL: http://market_data:8002
      STOCKMEM_URL: http://stockmem:8003
      FACTOR_LEDGE_URL: http://factor_ledge:8004
    depends_on:
      - crawler
      - aihub
      - market_data
      - stockmem
      - factor_ledge

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
